<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin – Đăng nhập</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--orange:#E8510A;--green:#1A7D3C;--dark:#111;--muted:#6b7280;--bg:#f4f5f7;--white:#fff;--radius:12px}
body{font-family:"Be Vietnam Pro",sans-serif;background:var(--bg);color:var(--dark);line-height:1.5;min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 80px}
.login-box{max-width:320px;margin:min(20vh,120px) auto;background:var(--white);padding:32px 28px;border-radius:var(--radius);box-shadow:0 8px 40px rgba(0,0,0,.08)}
label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;color:#374151}
input[type=password],input[type=text],input[type=url],textarea,select{
  width:100%;padding:11px 14px;border:1.8px solid #e5e7eb;border-radius:10px;
  font-family:inherit;font-size:14px;margin-bottom:16px;outline:none
}
input:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(26,125,60,.12)}
textarea{min-height:80px;resize:vertical}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 24px;border-radius:50px;font-weight:800;font-size:14px;
  border:none;cursor:pointer;font-family:inherit;transition:.2s
}
.btn-p{background:var(--orange);color:#fff;width:100%}
.btn-p:hover{background:#c44108}
.btn-g{background:var(--green);color:#fff}
.btn-g:hover{background:#145f2c}
.btn-o{background:#fff;color:var(--dark);border:2px solid #e5e7eb;text-decoration:none}
.btn-o:hover{border-color:var(--green);color:var(--green)}
.hdr{
  background:var(--white);padding:16px 20px;border-radius:var(--radius);
  margin-bottom:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;
  justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,.06);position:sticky;top:12px;z-index:100
}
.hdr h1{font-size:18px}
.hdr-actions{display:flex;flex-wrap:wrap;gap:8px}
.search{
  width:100%;padding:10px 16px;border:2px solid #e5e7eb;border-radius:50px;
  font-size:14px;font-family:inherit;margin-bottom:16px
}
.section{
  background:var(--white);border-radius:var(--radius);margin-bottom:16px;
  overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.05)
}
.section-hd{
  padding:14px 20px;background:linear-gradient(90deg,#0a2e1a,var(--green));
  color:#fff;font-weight:800;font-size:14px;cursor:pointer;user-select:none;
  display:flex;justify-content:space-between;align-items:center
}
.section-hd span{opacity:.8;font-size:12px;font-weight:600}
.section-bd{padding:20px;display:none}
.section.open .section-bd{display:block}
.field{margin-bottom:18px}
.field label{font-size:11px;color:var(--muted);margin-bottom:4px;display:block}
.field .key{font-size:10px;color:#9ca3af;font-weight:500}
.field-img-preview{width:100%;max-height:120px;object-fit:cover;border-radius:8px;margin-top:8px;border:1px solid #eee}
.field-hint{font-size:11px;color:var(--muted);margin-top:4px}
.field-hint code{background:#f3f4f6;padding:1px 6px;border-radius:4px}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--dark);color:#fff;padding:12px 24px;border-radius:50px;
  font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:9999
}
.toast.show{opacity:1}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="loginScreen" class="login-box wrap">
  <label for="loginPass">Mật khẩu</label>
  <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
  <button class="btn btn-p" type="button" id="loginBtn" onclick="doLogin()">Vào</button>
  <p id="loginErr" class="hidden" style="color:#b91c1c;font-size:12px;margin-top:8px"></p>
</div>

<div id="adminApp" class="hidden">
  <div class="wrap">
    <div class="hdr">
      <h1>Sửa nội dung</h1>
      <div class="hdr-actions">
        <button class="btn btn-g" type="button" id="saveBtn" onclick="saveAll()">Lưu</button>
        <a href="index.html" target="_blank" class="btn btn-o">Xem web</a>
        <button class="btn btn-o" type="button" onclick="logout()">Thoát</button>
      </div>
    </div>
    <input type="search" class="search" id="searchBox" placeholder="🔍 Tìm nội dung..." oninput="filterAdminFields()">
    <div id="sectionsRoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="cms-default.js"></script>
<script src="firebase-config.js"></script>
<script src="cms-firebase.js"></script>
<script src="cms.js"></script>
<script src="admin-ui.js"></script>
<script>
function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function () { t.classList.remove("show"); }, 2800);
}

function doLogin() {
  var pass = document.getElementById("loginPass").value;
  var email = window.FIREBASE_ADMIN_EMAIL;
  var errEl = document.getElementById("loginErr");
  var btn = document.getElementById("loginBtn");
  if (!email) {
    alert("Thiếu FIREBASE_ADMIN_EMAIL trong firebase-config.js");
    return;
  }
  if (!pass) {
    errEl.textContent = "Nhập mật khẩu";
    errEl.classList.remove("hidden");
    return;
  }
  errEl.classList.add("hidden");
  btn.disabled = true;
  btn.textContent = "Đang vào...";
  CMS_signIn(email, pass)
    .catch(function (e) {
      errEl.textContent =
        e.code === "auth/invalid-credential" || e.code === "auth/wrong-password"
          ? "Mật khẩu không đúng"
          : e.message || "Đăng nhập thất bại";
      errEl.classList.remove("hidden");
    })
    .finally(function () {
      btn.disabled = false;
      btn.textContent = "Vào";
    });
}

function logout() {
  CMS_signOut().then(function () {
    document.getElementById("adminApp").classList.add("hidden");
    document.getElementById("loginScreen").classList.remove("hidden");
    document.getElementById("loginPass").value = "";
  });
}

function showAdmin() {
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("adminApp").classList.remove("hidden");
  CMS_loadFirebase()
    .then(function () {
      return typeof CMS_seedFirebaseIfEmpty === "function"
        ? CMS_seedFirebaseIfEmpty()
        : null;
    })
    .then(function () {
      buildAdminForm();
    });
}

function saveAll() {
  var data = collectAdminForm();
  var btn = document.getElementById("saveBtn");
  btn.disabled = true;
  btn.textContent = "Đang lưu...";
  CMS_saveFirebase(data)
    .then(function () {
      window.CMS_firebaseData = data;
      CMS_saveContent(data);
      toast("✅ Đã lưu — mọi máy mở web sẽ thấy");
    })
    .catch(function (err) {
      alert("Lỗi lưu:\n" + err.message + "\n\nKiểm tra user Firebase Auth + Firestore Rules.");
    })
    .finally(function () {
      btn.disabled = false;
      btn.textContent = "Lưu";
    });
}

document.getElementById("loginPass").addEventListener("keydown", function (e) {
  if (e.key === "Enter") doLogin();
});

CMS_onAuthChanged(function (user) {
  if (user) showAdmin();
  else {
    document.getElementById("adminApp").classList.add("hidden");
    document.getElementById("loginScreen").classList.remove("hidden");
  }
});
</script>
</body>
</html>
